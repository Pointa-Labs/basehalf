name: CI

# Runs typecheck / build / test / lint on every push to main and every pull
# request, so a PR must be green before it can merge. Make this a *required*
# status check in Settings → Branches (alongside the CLA Assistant check).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18.17 is the root engines floor (Turbo 2.x requirement); 20 and 22 are LTS.
        node-version: ['18.17', '20.x', '22.x']
    steps:
      - uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node runs, so `cache: 'pnpm'` finds it.
      # Version is read from package.json's `packageManager` field (single source
      # of truth) — DO NOT add `version:` here, the action errors on duplicates.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - run: pnpm -r test
      - run: pnpm -r --if-present lint
