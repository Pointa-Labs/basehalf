name: "CLA Assistant"

# Enforces the BaseHalf Contributor License Agreement (CLA.md).
# A contribution cannot be merged until its author has signed the CLA by
# commenting the acceptance sentence on their pull request. Signatures are
# recorded in a JSON file on the `cla-signatures` branch of this repo.
#
# ── Setup note ───────────────────────────────────────────────────────────
#   Repo slug is Pointa-Labs/basehalf (update the URLs below if it changes).
#   In repo Settings → Branches, add a protection rule on `main` that requires
#   the "CLA Assistant" status check AND a PR review before merge. (The bot
#   only *labels* PRs; branch protection is what actually blocks the merge.)
# ─────────────────────────────────────────────────────────────────────────

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write       # write the signatures file on the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The exact sentence a contributor must comment to sign.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-notsigned-prcomment: "Thanks for your pull request! Before we can merge it, please sign the [BaseHalf Contributor License Agreement](https://github.com/Pointa-Labs/basehalf/blob/main/CLA.md). Reply to this PR with the sentence below; you only need to do this once."
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/Pointa-Labs/basehalf/blob/main/CLA.md"
          branch: "cla-signatures"
          # Bots that don't need to sign.
          allowlist: "dependabot[bot],github-actions[bot],*[bot]"
