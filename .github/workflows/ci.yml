name: CI

# Runs typecheck / build / test / lint on every push to main and every pull
# request, so a PR must be green before it can merge.
#
# Required status check (Settings → Branches): `ci-summary`. That single
# job fans in from the `test` matrix below — protection stays correct even
# when the matrix changes (matrix-specific names like `test (22.12)` drift
# silently otherwise; we got bitten by that on PR #9).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.12 is the workspace floor and matches the Electron toolchain.
        # 24 is the next supported LTS line and catches forward-compatibility issues.
        node-version: ['22.12', '24.x']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # pnpm must be on PATH before setup-node runs, so `cache: 'pnpm'` finds it.
      # The root workspace intentionally has no package.json, so keep this pinned
      # to the version used to generate pnpm-lock.yaml.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      # TypeScript project references may build dependency declarations while
      # checking a dependent package, so keep this graph traversal serialized.
      - run: pnpm -r --workspace-concurrency=1 typecheck
      - run: pnpm -r build
      - run: pnpm -r test
      - run: pnpm -r --if-present lint

  # Every action of every workflow is pinned to a full commit SHA. The check
  # is an .mts file, which Node 24 runs as it is.
  action-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'
      - run: node vscode-base/scripts/basehalf-workflow-action-pins.mts

  # Single fan-in status check so branch protection only needs ONE name.
  # `needs` waits for every matrix shard and the action pin check;
  # `if: always()` lets us report a real failure when any job fails (otherwise GitHub would
  # mark the summary as "skipped" and protection would consider it
  # missing). The result-check step turns a skip/failure of `test` into
  # an explicit non-zero exit.
  ci-summary:
    needs: [test, action-pins]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.action-pins.result }}" != "success" ]; then
            echo "::error::required jobs did not succeed (test=${{ needs.test.result }}, action-pins=${{ needs.action-pins.result }})"
            exit 1
          fi
          echo "All required jobs passed."
