name: Maintainer fast-lane

# ─────────────────────────────────────────────────────────────────────────
# The CLA (see cla.yml) is a *legal* gate for EXTERNAL contributions. The repo
# owner and maintainers hold the copyright and are CLA-exempt by definition.
# But the required `CLAAssistant` check only fires on pull-request events, so a
# maintainer's DIRECT PUSH to main — allowed because they are an admin and
# branch protection runs with enforce_admins=off — leaves `CLAAssistant` stuck
# on "Expected" forever, and the commit never goes green.
#
# This workflow closes that one gap for the maintainer fast-lane ONLY: on a
# push to main by an ALLOWLISTED maintainer, it marks the `CLAAssistant`
# required check green so the commit can settle green.
#
# It deliberately does NOT touch the quality gates: `ci-summary`
# (typecheck/build/test/lint) and `licenses` still run honestly on every push
# to main, so a broken push still shows red. The waiver is for the CLA check
# only — and it widens nothing, because pushing to main already requires admin
# and the allowlist narrows the waiver to named maintainer logins. External
# contributors are untouched: they open a PR, sign the CLA, and get the real
# CLAAssistant check plus code review.
#
# To add a maintainer: add their GitHub login to the ALLOWLIST array below.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]

permissions:
  statuses: write

jobs:
  cla-waiver:
    runs-on: ubuntu-latest
    # ALLOWLIST — GitHub logins waived from the CLA on a direct push to main.
    if: contains(fromJSON('["aron-76"]'), github.actor)
    steps:
      - name: Mark CLAAssistant green for the maintainer's direct push
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'CLAAssistant',
              description: 'Maintainer direct push — CLA waived (maintainer is CLA-exempt)',
            })
