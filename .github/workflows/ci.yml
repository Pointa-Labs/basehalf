name: CI

# Runs typecheck / build / test / lint on every push to main and every pull
# request, so a PR must be green before it can merge.
#
# Required status check (Settings → Branches): `ci-summary`. That single
# job fans in from the `test` matrix below — protection stays correct even
# when the matrix changes (matrix-specific names like `test (20.19)` drift
# silently otherwise; we got bitten by that on PR #9).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.19 is the root engines floor (electron-vite 5 requirement, Node 18 EOL);
        # 22 is current LTS and matches Electron 42+ runtime.
        node-version: ['20.19', '22.x']
    steps:
      - uses: actions/checkout@v4

      # pnpm must be on PATH before setup-node runs, so `cache: 'pnpm'` finds it.
      # The root workspace intentionally has no package.json, so keep this pinned
      # to the version used to generate pnpm-lock.yaml.
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - run: pnpm -r test
      - run: pnpm -r --if-present lint

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive infrastructure/plugins
      - run: terraform -chdir=infrastructure/plugins init -backend=false -input=false
      - run: terraform -chdir=infrastructure/plugins validate

  # Single fan-in status check so branch protection only needs ONE name.
  # `needs` waits for every matrix shard and infrastructure validation;
  # `if: always()` lets us report a real failure when any job fails (otherwise GitHub would
  # mark the summary as "skipped" and protection would consider it
  # missing). The result-check step turns a skip/failure of `test` into
  # an explicit non-zero exit.
  ci-summary:
    needs: [test, terraform]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.terraform.result }}" != "success" ]; then
            echo "::error::required jobs did not succeed (test=${{ needs.test.result }}, terraform=${{ needs.terraform.result }})"
            exit 1
          fi
          echo "All required jobs passed."
