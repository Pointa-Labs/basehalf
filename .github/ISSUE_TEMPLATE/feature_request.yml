name: Feature request / idea
description: Suggest an improvement to BaseHalf.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are very welcome — no CLA needed. Note the roadmap is core-team
        driven (see docs/roadmap.md). BaseHalf is a workspace, not an agent:
        we provide composable primitives (badges, references, canvas, views);
        the AI agent (Claude Code / Codex / …) brings the intelligence.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to see? If it's a new command, is it a primitive (good — agent can compose it) or a task-specific feature (likely out of scope — that's the agent's job)?
  - type: checkboxes
    id: invariants
    attributes:
      label: Fit check
      options:
        - label: This adds a composable primitive, not a task-specific or AI-orchestration feature.
        - label: This doesn't require bh to call an LLM or do agent orchestration.
        - label: This doesn't require bh to modify user files (`.md`, `.pdf`, …) without explicit user action.
