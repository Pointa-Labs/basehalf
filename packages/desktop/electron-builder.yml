# Packaging config (electron-builder). The app is fully self-contained after
# electron-vite build — main inlines @basehalf/core (+ its pure-JS chokidar),
# preload needs only electron, renderer is a static web bundle — so we pack
# `out/` alone: no node_modules collection, no pnpm-symlink headaches (all
# runtime deps live in devDependencies on purpose; see package.json note).
appId: com.pointalabs.basehalf
productName: BaseHalf
copyright: Copyright © 2026 Pointa Labs
directories:
  buildResources: build
  output: dist
files:
  - out/**
asar: true
npmRebuild: false

mac:
  # Unsigned for now (no Apple Developer ID yet): identity:null skips
  # signing entirely. First launch needs the one-time quarantine-clear
  # command (printed on the dmg background + release notes). Signing +
  # notarization is a fast-follow once a certificate exists; self-update
  # (main/updater.ts) is unaffected — its archives carry no quarantine.
  identity: null
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]

artifactName: ${productName}-${version}-${arch}.${ext}

# Installer window: branded background with the drag instruction and the
# one-time first-launch terminal command (we're unsigned for now, so spelling
# it out IN the installer beats a release-notes footnote). Icon coordinates
# must match the spots the background art leaves clear; Finder draws its own
# labels under the icons. dmg-background@2x.png alongside is picked up for retina.
dmg:
  title: ${productName} ${version}
  background: build/dmg-background.png
  iconSize: 120
  window:
    width: 660
    height: 420
  contents:
    - x: 180
      y: 195
      type: file
    - x: 480
      y: 195
      type: link
      path: /Applications
