name: license-check

# Enforces docs/dependency-policy.md: fails the PR if any production dependency
# carries a license outside the permissive allowlist. Each pnpm workspace
# package is checked from its own manifest so private workspace packages do not
# hide their production dependencies.
#
# To add a "review needed" license (e.g. MPL-2.0), append it to --onlyAllow
# below in the same PR, with a justification in the PR description.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.12"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # npx installs the checker into one shared cache folder. Packages checked
      # at the same time install it over each other and read it half-written
      # (2026-10-13 and 2026-10-24), so check one package at a time.
      - name: Check dependency licenses
        run: |
          pnpm -r --workspace-concurrency=1 exec npx --yes license-checker@25.0.1 \
            --production \
            --excludePrivatePackages \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense;BlueOak-1.0.0;Python-2.0" \
            --summary
