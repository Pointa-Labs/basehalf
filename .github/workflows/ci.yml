name: CI

# Runs the spec on every push to main and every pull request, so a PR must be
# green before it can merge. Make this a *required* status check in
# Settings → Branches (alongside the CLA Assistant check).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18.3 is the floor (package.json engines); 20 and 22 are current LTS.
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # The reference impl is dependency-light (no lockfile), so there is
      # nothing to install — `npm test` just runs `node --test`.
      - run: npm test
