name: Feature request / idea
description: Suggest an improvement to BaseHalf.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are very welcome — no CLA needed. Note the roadmap is core-team
        driven (see docs/roadmap.md), and BaseHalf is a *substrate*, not an agent:
        it deliberately ships primitives, not task-specific features.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to see? If it's a new command, is it a primitive (good) or a task (out of scope)?
  - type: checkboxes
    id: invariants
    attributes:
      label: Fit check
      options:
        - label: This keeps BaseHalf a substrate (a primitive), not an agent feature.
