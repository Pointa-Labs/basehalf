name: license-check

# Enforces docs/dependency-policy.md: fails the PR if any production dependency
# carries a license outside the permissive allowlist. Each pnpm workspace
# package is checked from its own manifest so private workspace packages do not
# hide their production dependencies.
#
# To add a "review needed" license (e.g. MPL-2.0), append it to --onlyAllow
# below in the same PR, with a justification in the PR description.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check dependency licenses
        run: |
          pnpm -r exec npx --yes license-checker@^25 \
            --production \
            --excludePrivatePackages \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense;BlueOak-1.0.0;Python-2.0" \
            --summary
