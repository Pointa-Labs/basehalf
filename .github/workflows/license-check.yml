name: license-check

# Enforces docs/dependency-policy.md: fails the PR if any production dependency
# carries a license outside the permissive allowlist.
#
# It checks the product's production dependencies, from package.json at the
# root, which are what runs from node_modules in the application, and those of
# the package of the install command, packages/install/, from its own manifest.
#
# A "review needed" package that a maintainer accepted is an exception by name
# and version in --excludePackages, never a license added to --onlyAllow, and is
# recorded in the policy's "Reviewed exceptions" in the same PR (D160).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  licenses:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/install
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.12"
          cache: "pnpm"
          cache-dependency-path: packages/install/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check dependency licenses
        run: |
          npx --yes license-checker@25.0.1 \
            --production \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense;BlueOak-1.0.0;Python-2.0" \
            --summary

  product-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Install the product's production dependencies
        # Without their scripts: nothing is built, the check reads the packages' manifests.
        run: npm ci --ignore-scripts --omit=dev
      - name: Check dependency licenses
        # The root package is private and is not a dependency. The two packages left out are
        # the reviewed exceptions of docs/dependency-policy.md, each at the version reviewed.
        run: |
          npx --yes license-checker@25.0.1 \
            --production \
            --excludePrivatePackages \
            --excludePackages "jschardet@3.1.4;@vscode/codicons@0.0.46-21" \
            --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense;BlueOak-1.0.0;Python-2.0" \
            --summary
